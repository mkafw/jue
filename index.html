<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jue · 问答系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #132850;
      min-height: 100vh;
    }
    .header {
      background: #fff;
      border-bottom: 1px solid #e1e8ed;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header p { font-size: 13px; color: #657786; margin-top: 2px; }
    .container { max-width: 600px; margin: 0 auto; padding: 12px; }
    #gwitter { min-height: 400px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧬 jue</h1>
    <p>问答系统 · 双核学习引擎</p>
  </div>
  <div class="container">
    <div id="gwitter"></div>
  </div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/gwitter/dist/gwitter.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/gwitter/dist/gwitter.min.css">

  <script>
    gwitter({
      container: document.getElementById('gwitter'),
      config: {
        request: {
          owner: 'mkafw',
          repo: 'jue',
          pageSize: 20,
        },
        app: {
          onlyShowOwner: true,
          enableRepoSwitcher: false,
          enableAbout: false,
          enableEgg: false,
        },
      },
    });
  </script>
</body>
</html>
